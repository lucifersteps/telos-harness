# Test-owned host settings, never included in the distributed plugin.
- id: session-title-llm
  disabled: true
- id: agent-default-model
  config:
    provider: deepseek-official
    model: !!js process.env.TELOS_MODEL
    reasoningEffort: off
- id: llm-deepseek
  config:
    baseURL: !!js process.env.DEEPSEEK_BASE_URL
    thinking: disabled
    streamIdleTimeoutMs: 180000
